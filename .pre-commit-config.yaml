repos:
  # Basic repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # P6 PPM pixel data must not be modified by text fixers.
        exclude: ^projects/project3/assets/dataset/images/.*\.ppm$
      - id: end-of-file-fixer
        exclude: ^projects/project3/assets/dataset/images/.*\.ppm$

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-i, --style=file]
        types_or: [c, c++, cuda]
        files: \.(cpp|hpp|h|cc|cxx|cu|cuh)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
